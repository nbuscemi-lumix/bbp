<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBP Editorial Calendar (Gantt view, for consideration)</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#ffffff;--panel:#fafaf8;--ink:#161614;--mute:#6b6a64;--line:#e6e5df;--line2:#f0efea;
  --web:#1f5f7a;--rev:#b7791f;--li:#7a3e9d;--today:#d0021b;--accent:#103F57;
  --task-w:360px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171716;--panel:#1f1f1d;--ink:#f2f1ec;--mute:#a09f97;--line:#31312e;--line2:#262624;
    --web:#5fb0d0;--rev:#e0b050;--li:#c295e0;--today:#ff5d6e;--accent:#8fc3dd}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:32px 20px 48px}
.wrap{max-width:1500px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.sheet{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:13px}
.sheet:hover{border-color:var(--accent)}
.sheet b{display:block;font-weight:600}
.sheet small{color:var(--mute);font-size:11px}
.sheet svg{flex:none;color:var(--accent)}
.bar-row{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12px;color:var(--mute)}
.bar-row button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.bar-row button:hover{border-color:var(--accent)}
.key{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.web{background:var(--web)}.dot.rev{background:var(--rev)}.dot.li{background:var(--li)}
.dot.prop{background:transparent;border:1.5px dashed var(--mute)}
label.tog{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.gantt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.head{display:grid;grid-template-columns:var(--task-w) 1fr;background:var(--panel);border-bottom:1px solid var(--line)}
.head .l{border-right:1px solid var(--line);padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);display:flex;align-items:flex-end}
.months{display:flex}
.mo{text-align:center;padding:9px 0 7px;font-size:12px;font-weight:600;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.mo:last-child{border-right:0}
.wk{position:relative;height:22px;border-top:1px solid var(--line2)}
.wk span{position:absolute;top:4px;transform:translateX(-50%);font-size:10px;color:var(--mute)}
.body{position:relative}
.grid{position:absolute;left:var(--task-w);right:0;top:0;bottom:0;pointer-events:none;z-index:0}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:4}
.today::after{content:"Today";position:absolute;top:2px;left:4px;font-size:10px;color:var(--today);font-weight:600}
.rows{display:grid;grid-template-columns:var(--task-w) 1fr;position:relative;z-index:1}
.c{border-bottom:1px solid var(--line2);min-height:38px;display:flex;align-items:center}
.cl{padding:6px 14px;border-right:1px solid var(--line);gap:8px}
.cr{position:relative}
.sec{grid-column:1 / -1;background:var(--panel);border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600}
.piece.cl{cursor:pointer;user-select:none}
.piece.cl:hover{background:var(--panel)}
.caret{width:12px;font-size:10px;color:var(--mute);flex:none}
.caret::before{content:"\25BE"}.collapsed .caret::before{content:"\25B8"}
.pname{font-weight:600;font-size:13px;line-height:1.25;flex:1;min-width:0}
.pdue{font-size:11px;color:var(--mute);white-space:nowrap;width:78px;flex:none;border-left:1px solid var(--line);padding-left:10px;align-self:stretch;display:flex;align-items:center}
.icons{display:inline-flex;gap:4px;flex:none;width:58px;border-left:1px solid var(--line);padding-left:10px;align-self:stretch;align-items:center;justify-content:flex-start}
.ic{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.ic.web{background:var(--web)}.ic.li{background:var(--li)}
@media (prefers-color-scheme:dark){.ic{color:#111}}
.ic svg{width:12px;height:12px}
.cl.s{padding-left:40px;position:relative}
.cl.s::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;background:var(--line)}
.cl.s::after{content:"";position:absolute;left:20px;top:50%;width:12px;height:1px;background:var(--line)}
.s .tname{font-size:12.5px;color:var(--ink);line-height:1.3}
.cl.ss{padding-left:72px;position:relative}
.cl.ss::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;background:var(--line)}
.cl.ss::after{content:"";position:absolute;left:52px;top:50%;width:12px;height:1px;background:var(--line)}
.ss .tname{font-size:12px;color:var(--mute);line-height:1.3}
.tag{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border:1px dashed var(--mute);border-radius:4px;padding:0 4px;color:var(--mute);margin-left:6px;white-space:nowrap}
.range{position:absolute;top:50%;height:20px;transform:translateY(-50%);border-radius:5px;background:linear-gradient(90deg,var(--web),var(--li));opacity:.9}
.range .lbl{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.ms{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.ms.web{background:var(--web)}.ms.rev{background:var(--rev)}.ms.li{background:var(--li)}
.ms.pub{width:16px;height:16px;border-radius:3px;transform:translate(-50%,-50%) rotate(45deg)}
.ms.prop{background:transparent;border:1.5px dashed var(--mute);box-shadow:none;width:11px;height:11px}
.mlbl{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mute);white-space:nowrap}
.hide{display:none!important}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.tab{font:inherit;font-size:13px;padding:7px 16px;border:0;background:var(--panel);color:var(--mute);cursor:pointer}
.tab.on{background:var(--accent);color:var(--bg);font-weight:600}
.cal{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
.cal .dow div{padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.cal .wkr{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .day{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--panel);opacity:.55}
.cal .day.we{background:var(--panel)}
.cal .dn{font-size:12px;color:var(--mute);margin-bottom:4px}
.cal .day.today .dn{color:#fff;background:var(--today);display:inline-block;border-radius:10px;padding:0 7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;outline:1px solid color-mix(in srgb,var(--ink) 25%,transparent);outline-offset:-1px}
.post{display:block;background:color-mix(in srgb,var(--tc) 30%,transparent);border-left:4px solid var(--tc);outline:1px solid color-mix(in srgb,var(--ink) 14%,transparent);outline-offset:-1px;border-radius:4px;padding:4px 6px;margin-bottom:4px;font-size:11.5px;line-height:1.3}
.post small{display:block;color:var(--mute);font-size:10.5px}
@media (max-width:900px){.cal .day{min-height:80px;padding:3px}.post{font-size:10px;padding:2px 4px}}
.foot{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.5}
.err{padding:18px;color:var(--mute);font-size:13px}
@media (max-width:900px){:root{--task-w:230px}.pdue{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Black Bay Partners: Editorial Calendar</h1>
      <div class="sub">Last update: <span id="gen"></span></div>
    </div>
    <a class="sheet" id="sheet" href="https://docs.google.com/spreadsheets/d/1PTx9kSYYL98e-r5njal2AzMrxfTFKBj4wtY1yi4FKDc/edit" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>
      <span><b>Review content spreadsheet</b><small>Opens in Google Drive</small></span>
    </a>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabG" role="tab" data-v="g">Timeline</button>
    <button class="tab" id="tabS" role="tab" data-v="s">Social calendar</button>
  </div>

  <div id="viewG">
  <div class="bar-row">
    <button id="collapse">Collapse all</button><button id="expand">Expand all</button>
    <label class="tog"><input type="checkbox" id="showprop" checked> Show internal sub-tasks</label>
    <span class="key"><span class="dot web"></span>Website</span>
    <span class="key"><span class="dot rev"></span>Review</span>
    <span class="key"><span class="dot li"></span>LinkedIn</span>
    <span class="key">&#9670; Publish date</span>
    <span class="key"><span class="dot prop"></span>Internal sub-tasks</span>
  </div>

  <div class="gantt">
    <div class="head">
      <div class="l">Content piece, platforms</div>
      <div><div class="months" id="months"></div><div class="wk" id="wk"></div></div>
    </div>
    <div class="body" id="body">
      <div class="grid" id="grid"></div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
  </div>

  <div id="viewS" class="hide">
    <div class="bar-row">
      <button id="prevM">&larr;</button><b id="monLbl" style="color:var(--ink);font-size:15px;min-width:130px;text-align:center"></b><button id="nextM">&rarr;</button>
      <span id="monCount"></span>
    </div>
    <div class="bar-row" id="calKey"></div>
    <div class="cal" id="cal"></div>
  </div>
</div>

<script>
fetch("data.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(DATA){
(function(){
  var DAY=86400000;
  function d(s){return new Date(s+"T00:00:00Z")}
  var start=d("2026-11-16"), end=d("2027-02-22"), total=end-start;
  function pct(s){return (d(s)-start)/total*100}
  function pctD(dt){return (dt-start)/total*100}
  function fmt(s){var x=d(s);return x.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})}
  document.getElementById("gen").textContent=new Date(DATA.generated).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

  // header
  var months=document.getElementById("months"), wk=document.getElementById("wk"), grid=document.getElementById("grid");
  var cur=new Date(start);
  while(cur<end){
    var m=cur.getUTCMonth(), y=cur.getUTCFullYear();
    var nxt=new Date(Date.UTC(y,m+1,1)); if(nxt>end) nxt=end;
    var el=document.createElement("div"); el.className="mo";
    el.style.flex="0 0 "+((nxt-cur)/total*100)+"%";
    el.textContent=cur.toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
    months.appendChild(el); cur=nxt;
  }
  for(var t=new Date(start);t<end;t=new Date(t.getTime()+7*DAY)){
    var p=pctD(t)+0.4;
    var s=document.createElement("span"); s.style.left=p+"%"; s.textContent=t.getUTCDate(); wk.appendChild(s);
    var g=document.createElement("div"); g.className="gl"; g.style.left=pctD(t)+"%"; grid.appendChild(g);
  }
  var now=new Date(); var td=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  if(td>=start&&td<=end){var tl=document.createElement("div");tl.className="today";tl.style.left=pctD(td)+"%";grid.appendChild(tl)}

  var SVG={
    web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
    li:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11l7.4-4M8.3 13l7.4 4"/></svg>'
  };
  function kind(n){
    if(/^\[LinkedIn\]/i.test(n)) return "li";
    if(/^\[Review\]/i.test(n)) return "rev";
    if(/^\[Web\]\s*Publish/i.test(n)) return "pub";
    return "web";
  }
  function clean(n){return n.replace(/^\[[^\]]+\]\s*/,"")}
  // proposed sub-subtasks, only for LinkedIn graphics and posts (illustrative)
  function proposed(task){
    var n=task.name;
    if(/Announcement|LinkedIn Post/i.test(n)) return ["Write post copy","Schedule post"];
    if(/graphic/i.test(n)) return ["Write graphic copy","Design graphic","Schedule post"];
    if(/Publish/i.test(n)) return ["Add internal links","Update hub feed"];
    return [];
  }
  var rows=document.getElementById("rows"), pi=0;
  function cell(cls,html){var e=document.createElement("div");e.className="c "+cls;if(html!=null)e.innerHTML=html;return e}
  function sec(t){var e=document.createElement("div");e.className="sec";e.textContent=t;rows.appendChild(e)}
  var hubDone=false, artDone=false, coDone=false;
  DATA.pieces.forEach(function(p){
    var isHub=/^Hub:/i.test(p.name);
    if(isHub&&!hubDone){sec("Hub page");hubDone=true}
    var isCo=/^Company:/i.test(p.name);
    if(isCo&&!coDone){sec("COMPANY");coDone=true}
    if(!isHub&&!isCo&&!artDone){sec("INSIGHT ARTICLES / SPOKES");artDone=true}
    var id="p"+(pi++);
    var kinds={};
    p.tasks.forEach(function(t){var k=kind(t.name);kinds[k==="rev"?"rev":(k==="li"?"li":"web")]=1});
    var ic="";
    if(kinds.web) ic+='<span class="ic web" title="Website">'+SVG.web+'</span>';
    if(kinds.li) ic+='<span class="ic li" title="LinkedIn">'+SVG.li+'</span>';
    var dates=p.tasks.map(function(t){return t.due}).filter(Boolean).sort();
    var name=p.name.replace(/^(Hub|Insight Article|Company):\s*/,"");
    var left=cell("piece cl","");
    left.dataset.id=id; left.setAttribute("role","button"); left.tabIndex=0;
    left.innerHTML='<span class="caret"></span><span class="pname">'+name+'</span><span class="icons">'+ic+'</span><span class="pdue">'+(p.due?"Pub "+fmt(p.due):"")+'</span>';
    var right=cell("cr piece","");right.dataset.pr=id;
    if(dates.length){
      var a=pct(dates[0]), b=pct(dates[dates.length-1]);
      var r=document.createElement("div");r.className="range";r.style.left=a+"%";r.style.width=Math.max(b-a,0.8)+"%";
      r.innerHTML='<span class="lbl">'+fmt(dates[0])+(dates.length>1&&dates[0]!==dates[dates.length-1]?" to "+fmt(dates[dates.length-1]):"")+'</span>';
      right.appendChild(r);
    }
    rows.appendChild(left);rows.appendChild(right);
    p.tasks.slice().sort(function(x,y){return (x.due||"").localeCompare(y.due||"")}).forEach(function(t){
      var k=kind(t.name);
      var l=cell("s cl",'<span class="tname">'+clean(t.name)+'</span>');l.dataset.g=id;
      var rr=cell("cr s","");rr.dataset.g=id;
      if(t.due){
        var m=document.createElement("div");m.className="ms "+(k==="pub"?"web pub":k);m.style.left=pct(t.due)+"%";rr.appendChild(m);
        var lb=document.createElement("div");lb.className="mlbl";
        var p0=pct(t.due);
        if(p0>88){lb.style.right=(100-p0+1.4)+"%"}else{lb.style.left=(p0+1.4)+"%"}
        lb.textContent=fmt(t.due);rr.appendChild(lb);
      }
      rows.appendChild(l);rows.appendChild(rr);
      var props=proposed(t);
      props.forEach(function(nm,i){
        var l2=cell("ss cl",'<span class="tname">'+nm+'</span><span class="tag">internal</span>');l2.dataset.g=id;l2.dataset.prop="1";
        var r2=cell("cr ss","");r2.dataset.g=id;r2.dataset.prop="1";
        if(t.due){
          var off=(props.length-i)*2;
          var dt=new Date(d(t.due).getTime()-off*DAY);
          if(dt.getUTCDay()===0)dt=new Date(dt.getTime()-2*DAY); if(dt.getUTCDay()===6)dt=new Date(dt.getTime()-DAY);
          var mm=document.createElement("div");mm.className="ms prop";mm.style.left=pctD(dt)+"%";r2.appendChild(mm);
        }
        rows.appendChild(l2);rows.appendChild(r2);
      });
    });
  });

  // collapse logic
  var collapsed={};
  var showProp=document.getElementById("showprop");
  function render(){
    rows.querySelectorAll("[data-g]").forEach(function(e){
      var h=collapsed[e.dataset.g]||(e.dataset.prop&&!showProp.checked);
      e.classList.toggle("hide",!!h);
    });
    rows.querySelectorAll(".piece.cl").forEach(function(e){e.classList.toggle("collapsed",!!collapsed[e.dataset.id])});
  }
  rows.addEventListener("click",function(e){var el=e.target.closest(".piece.cl");if(!el)return;collapsed[el.dataset.id]=!collapsed[el.dataset.id];render()});
  rows.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var el=e.target.closest(".piece.cl");if(!el)return;e.preventDefault();collapsed[el.dataset.id]=!collapsed[el.dataset.id];render()});
  document.getElementById("collapse").onclick=function(){rows.querySelectorAll(".piece.cl").forEach(function(e){collapsed[e.dataset.id]=true});render()};
  document.getElementById("expand").onclick=function(){collapsed={};render()};
  showProp.onchange=render;
  render();

  // views
  var TOPIC={"Market Insights page":["Hub","#103F57"],"Storage":["Storage","#AFCFFF"],"Energy System":["Energy System","#204B2C"],"Sour Gas Treating":["Sour Gas Treating","#870632"],"Midstream":["Midstream","#c46a86"],"Asset Integrity":["Asset Integrity","#FFFEC0"],"Industrial Controls":["Industrial Controls","#6F95B8"],"AI Operating Efficiency":["AI Operating Efficiency","#6C9A76"],"General LinkedIn Content":["Company","#C9A227"]};
  function tcol(piece){return (TOPIC[piece]||[0,"#8a8984"])[1]}
  function tname(piece){return (TOPIC[piece]||[piece])[0]}
  var posts={};
  DATA.pieces.forEach(function(p){
    var piece=p.name.replace(/^(Hub|Insight Article|Company):\s*/,"");
    p.tasks.forEach(function(t){
      if(kind(t.name)==="li"&&t.due){(posts[t.due]=posts[t.due]||[]).push({col:tcol(piece),n:/^Hub:/i.test(p.name)?clean(t.name):clean(t.name).replace(/:\s*[^:]*$/,""),piece:piece})}
    });
  });
  var keys=Object.keys(posts).sort();
  var mo=keys.length?d(keys[0]):new Date();
  var cm=new Date(Date.UTC(mo.getUTCFullYear(),mo.getUTCMonth(),1));
  var firstM=new Date(cm), lastM=keys.length?d(keys[keys.length-1]):cm;
  lastM=new Date(Date.UTC(lastM.getUTCFullYear(),lastM.getUTCMonth(),1));
  function iso(x){return x.toISOString().slice(0,10)}
  (function(){var seen={},h="";
    DATA.pieces.forEach(function(p){var pc=p.name.replace(/^(Hub|Insight Article|Company):\s*/,"");if(seen[pc])return;seen[pc]=1;
      h+='<span class="key"><span class="sw" style="background:'+tcol(pc)+'"></span>'+tname(pc)+'</span>'});
    document.getElementById("calKey").innerHTML=h})();
  function renderCal(){
    var y=cm.getUTCFullYear(),m=cm.getUTCMonth();
    document.getElementById("monLbl").textContent=cm.toLocaleDateString("en-US",{month:"long",year:"numeric",timeZone:"UTC"});
    var gs=new Date(Date.UTC(y,m,1)); gs=new Date(gs.getTime()-gs.getUTCDay()*DAY);
    var ge=new Date(Date.UTC(y,m+1,0)); ge=new Date(ge.getTime()+(6-ge.getUTCDay())*DAY);
    var h='<div class="dow">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(n){return"<div>"+n+"</div>"}).join("")+'</div>';
    var count=0, todayIso=iso(td);
    for(var x=new Date(gs);x<=ge;x=new Date(x.getTime()+DAY)){
      if(x.getUTCDay()===0)h+='<div class="wkr">';
      var k=iso(x), out=x.getUTCMonth()!==m, we=x.getUTCDay()===0||x.getUTCDay()===6;
      h+='<div class="day'+(out?" out":"")+(we?" we":"")+(k===todayIso?" today":"")+'"><div class="dn">'+x.getUTCDate()+'</div>';
      (posts[k]||[]).forEach(function(q){h+='<span class="post" style="--tc:'+q.col+'">'+q.n+'<small>'+tname(q.piece)+'</small></span>';if(!out)count++});
      h+='</div>';
      if(x.getUTCDay()===6)h+='</div>';
    }
    document.getElementById("cal").innerHTML=h;
    document.getElementById("monCount").textContent=count+(count===1?" post":" posts")+" this month";
    document.getElementById("prevM").disabled=cm<=firstM;
    document.getElementById("nextM").disabled=cm>=lastM;
  }
  document.getElementById("prevM").onclick=function(){cm=new Date(Date.UTC(cm.getUTCFullYear(),cm.getUTCMonth()-1,1));renderCal()};
  document.getElementById("nextM").onclick=function(){cm=new Date(Date.UTC(cm.getUTCFullYear(),cm.getUTCMonth()+1,1));renderCal()};
  function setView(v){
    document.getElementById("viewG").classList.toggle("hide",v!=="g");
    document.getElementById("viewS").classList.toggle("hide",v!=="s");
    document.getElementById("tabG").classList.toggle("on",v==="g");
    document.getElementById("tabS").classList.toggle("on",v==="s");
    if(v==="s")renderCal();
    try{history.replaceState(null,"","#"+v)}catch(e){}
  }
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setView(b.dataset.v)}});
  if(location.hash==="#s")setView("s");
})();
}).catch(function(){document.getElementById("rows").innerHTML='<div class="err" style="grid-column:1/-1">Could not load data.json.</div>'});
</script>
</body>
</html>
